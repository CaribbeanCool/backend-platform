name: Backend CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

jobs:
    test:
        name: Test and Lint
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17

                env:
                    POSTGRES_USER: test_user
                    POSTGRES_PASSWORD: test_password
                    POSTGRES_DB: test_db

                ports:
                    - 5432:5432

                options: >-
                    --health-cmd "pg_isready -U test_user -d test_db"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7-alpine

                ports:
                    - 6379:6379

                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
            TEST_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
            REDIS_URL: redis://localhost:6379/0

            JWT_SECRET_KEY: ci-test-secret-key-not-for-production
            JWT_ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: pip

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Check dependencies
              run: pip check

            - name: Lint
              run: ruff check .

            - name: Run migrations
              run: alembic upgrade head

            - name: Run tests
              run: pytest -v --cov=app --cov-report=term-missing

    docker:
        name: Build Docker Image
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Build image
              run: docker build -t backend-platform:ci .
